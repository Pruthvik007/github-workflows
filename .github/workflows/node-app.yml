name: Node app

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding package.json
        type: string
        default: "."
    secrets:
      PACKAGES_TOKEN:
        required: false
      BUILD_ENV:
        description: NAME=value lines exported to the build step, for apps that need keys at build time
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run lint --if-present
      - run: npm test --if-present
      - name: Load build environment
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          if [ -n "$BUILD_ENV" ]; then
            printf '%s\n' "$BUILD_ENV" >> "$GITHUB_ENV"
          fi
      - run: npm run build --if-present
