name: npm library

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # On main: opens the "Version Packages" pull request while changesets are pending, publishes once it is merged
  release:
    needs: build
    if: "!github.event.repository.is_template && github.event_name == 'push' && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          # changeset version bumps package.json only; the library's version-packages script also syncs the lockfile
          version-script: npm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

  canary:
    needs: build
    if: "!github.event.repository.is_template && github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Require a pending changeset
        run: |
          if ! find .changeset -name '*.md' ! -name README.md | grep -q .; then
            echo "::error::No pending changeset on ${GITHUB_REF_NAME}. Run npx changeset, push it, then run this again."
            exit 1
          fi
      - run: npx changeset version --snapshot canary
      - run: npm run release -- --tag canary --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
